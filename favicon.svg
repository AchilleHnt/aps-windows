  </style>
  <rect class="pane" x="2" y="2" width="9" height="9" rx="1.5" />
  <rect class="pane" x="13" y="2" width="9" height="9" rx="1.5" />
  <rect class="pane" x="2" y="13" width="9" height="9" rx="1.5" />
  <rect class="last" x="13" y="13" width="9" height="9" rx="1.5" />
</svg>
