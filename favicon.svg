<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .pane { fill: #17213b; }
    .last { fill: #ffb000; }
    /* Onglets sombres : les carreaux passent en clair pour rester visibles */
